<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reproductor · Sonora</title>
  <link rel="icon" href="assets/logos/sonora-mark-dark.svg" type="image/svg+xml">
  <!-- Aplica el tema guardado antes de pintar para evitar un destello -->
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("sonora-tema") || "dark"; } catch (e) {}</script>
  <link rel="stylesheet" href="dist/app.css">
</head>
<body class="min-h-dvh">
  <a href="#contenido" class="snr-btn-secondary sr-only bg-surface-raised focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50">Saltar al contenido</a>

  <div class="md:grid md:grid-cols-[240px_1fr]">
    <aside id="barra-lateral" class="sticky top-0 hidden h-dvh border-r border-line bg-surface-raised pb-24 md:block"></aside>
    <div class="min-w-0">
      <header id="cabecera-movil" class="flex items-center justify-between px-4 pt-4 md:hidden"></header>
      <main id="contenido" tabindex="-1" class="mx-auto flex max-w-6xl flex-col gap-8 px-4 pb-44 pt-6 focus:outline-none md:px-8 md:pb-32 md:pt-8">
        <div class="grid gap-8 lg:grid-cols-[1fr_320px]">
          <section aria-labelledby="r-titulo" class="flex flex-col items-center gap-6 rounded-lg bg-surface-raised p-6 md:p-8">
            <div class="flex w-full justify-start">
              <a id="r-volver" href="index.html" class="snr-btn-ghost -ml-2"><span>Volver</span></a>
            </div>
            <div id="r-portada" class="w-full max-w-xs shadow-raise"></div>
            <div class="flex w-full max-w-md flex-col items-center gap-1 text-center">
              <h1 id="r-titulo" class="text-title"></h1>
              <p id="r-artista" class="text-body-sm text-ink-muted"></p>
              <p id="r-origen" class="text-body-sm text-ink-muted"></p>
            </div>
            <div class="flex w-full max-w-md items-center gap-3">
              <span id="r-t" class="w-12 text-right font-mono text-mono-sm text-ink-muted">00:00</span>
              <div id="r-progreso" role="slider" tabindex="0" aria-label="Progreso de la canción" aria-valuemin="0" class="snr-focus flex flex-1 cursor-pointer items-center rounded-pill py-2"><div class="snr-track"><div class="snr-fill" style="width:0%"></div></div></div>
              <span id="r-dur" class="w-12 font-mono text-mono-sm text-ink-muted">00:00</span>
            </div>
            <div class="flex items-center gap-3">
              <button type="button" id="r-aleatorio" class="snr-icon-btn" aria-label="Aleatorio" aria-pressed="false" data-icono="shuffle"></button>
              <button type="button" id="r-anterior" class="snr-icon-btn" aria-label="Anterior" data-icono="skip-prev"></button>
              <button type="button" id="r-play" class="snr-play size-16!"></button>
              <button type="button" id="r-siguiente" class="snr-icon-btn" aria-label="Siguiente" data-icono="skip-next"></button>
              <button type="button" id="r-gusta" class="snr-icon-btn" aria-label="Me gusta" aria-pressed="false" data-icono="heart"></button>
            </div>
            <div class="flex w-full max-w-60 items-center gap-2">
              <span class="text-ink-muted" data-icono="volume"></span>
              <div id="r-volumen" role="slider" tabindex="0" aria-label="Volumen" aria-valuemin="0" class="snr-focus flex flex-1 cursor-pointer items-center rounded-pill py-2"><div class="snr-track"><div class="snr-fill" style="width:0%"></div></div></div>
            </div>
          </section>

          <section aria-labelledby="t-cola" class="flex flex-col gap-4">
            <h2 id="t-cola" class="text-heading">En cola</h2>
            <ol id="r-cola" class="flex flex-col"></ol>
          </section>
        </div>
      </main>
    </div>
  </div>

  <div id="barra-reproductor" role="region" aria-label="Reproductor" class="fixed inset-x-0 bottom-16 z-20 border-t border-line bg-surface-raised md:bottom-0"></div>
  <nav id="nav-movil" aria-label="Principal" class="fixed inset-x-0 bottom-0 z-20 h-16 border-t border-line bg-surface-raised md:hidden"></nav>
  <p id="aviso" class="sr-only" aria-live="polite"></p>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/player.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/paginas/reproductor.js"></script>
</body>
</html>
